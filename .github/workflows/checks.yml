name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv python install
      - run: uv sync --locked
      - name: Unit tests (no models needed)
        run: |
          uv run --locked python -m unittest discover -s tests
          for script in hpc/*; do bash -n "$script"; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_loop.mjs
