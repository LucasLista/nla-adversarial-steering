name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv python install
      - run: uv sync --locked
      - name: Check Python scripts without downloading models
        run: |
          uv run --locked python --version
          uv run --locked python -m compileall -q setup.py download.py launch.py stepper.py codex_editor.py trajectories.py hpc_control.py test_editor.py test_trajectories.py test_server_auth.py smoke_test.py test_stepper_live.py
          uv run --locked python -c 'import setup, download, launch, stepper, smoke_test, test_stepper_live'
          uv run --locked python -m unittest test_editor test_trajectories test_server_auth
          uv run --locked setup.py --help
          uv run --locked launch.py --help
          uv run --locked trajectories.py --help
          uv run --locked hpc_control.py --help
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node test_loop.mjs
