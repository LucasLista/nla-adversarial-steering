<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HPC experiments</title>
<style>body{background:#111827;color:#e5e7eb;font:15px system-ui;max-width:1400px;margin:28px auto;padding:0 20px}button,select{background:#243147;color:inherit;border:1px solid #526078;border-radius:6px;padding:8px;cursor:pointer}nav{display:flex;flex-wrap:wrap;gap:5px;margin:20px 0}nav button{font:12px monospace}nav button.selected{outline:2px solid #eab867}nav button.agree{background:#374151;color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{border:1px solid #374151;border-radius:10px;padding:16px;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#aab6ca}table{width:100%;table-layout:fixed;font:13px monospace;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid #243147}td:first-child{width:55%;overflow-wrap:anywhere}td:nth-child(2){white-space:nowrap}td:last-child{width:45px}tr.chosen{background:#45351c;color:#ffe0a0}.bar{height:3px;background:#a78bfa;margin-top:5px}h3{font-size:16px}a{color:#93c5fd}</style>
<h1>HPC experiments</h1><select id="run"></select> <select id="branch"><option value="original">Original</option><option value="roundtrip">Reconstructed</option><option value="edited_raw">Edited</option><option value="edited_corrected">Edited + error</option></select> <small>Updates every 5 seconds · read-only</small>
<p id="status"></p><div class="card"><pre id="text"></pre></div><nav id="tokens"></nav><p id="step"></p><div class="grid"><div class="card"><h3>Original NLA</h3><pre id="original"></pre></div><div class="card"><h3>Edited NLA</h3><pre id="edit"></pre></div></div><details><summary>Metrics and activation vectors</summary><pre id="metrics"></pre></details><div class="grid" id="distributions"></div>
<script>
const $=id=>document.getElementById(id);let selection=null,epoch=0;const labels={original:'Original',roundtrip:'Reconstructed',edited_raw:'Edited',edited_corrected:'Edited + error'};
async function get(index){const q=new URLSearchParams({run:$('run').value,branch:$('branch').value});if(index!==undefined)q.set('index',index);const r=await fetch('/api?'+q);if(!r.ok)throw Error('Checkpoint unavailable');return r.json()}
async function inspect(i){selection=i;const current=epoch;const d=await get(i);if(current!==epoch||selection!==i)return;document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('selected',j===i));const b=$('tokens').children[i];if(b)b.classList.toggle('agree',d.agreement);$('step').textContent='Token '+(i+1)+(d.agreement?' · all four agree':'');$('original').textContent=d.original||'Not computed for this branch';$('edit').textContent=d.edit||'—';$('metrics').textContent=JSON.stringify({metrics:d.metrics,h:d.h,reconstruction:d.reconstruction,error:d.error},null,2);$('distributions').replaceChildren();for(const [key,v] of Object.entries(d.distributions)){const card=document.createElement('div');card.className='card';const h=document.createElement('h3');h.textContent=labels[key];card.append(h);const table=document.createElement('table');for(const row of v.completion_probabilities?.[0]?.top_logprobs||[]){const tr=document.createElement('tr');const chosen=key===d.variant&&row.id===d.chosen;tr.className=chosen?'chosen':'';for(const value of [JSON.stringify(row.token),(Math.exp(row.logprob)*100).toFixed(3)+'%',chosen?'✓':'']){const td=document.createElement('td');td.textContent=value;tr.append(td)}const bar=document.createElement('div');bar.className='bar';bar.style.width=(Math.exp(row.logprob)*100)+'%';tr.children[1].append(bar);table.append(tr)}card.append(table);$('distributions').append(card)}}
async function refresh(){const current=epoch;try{const d=await get();if(current!==epoch)return;$('status').textContent=!d.started?'Waiting for this branch':d.tokens.length+' tokens'+(d.ended?' · EOS':d.complete?' · token limit':' · saved progress');$('text').textContent=d.text;while($('tokens').children.length<d.tokens.length){const i=$('tokens').children.length;const b=document.createElement('button');b.textContent=(i+1)+' · '+(d.texts?.[i]!=null?JSON.stringify(d.texts[i]):'#'+d.tokens[i]);b.title='token id '+d.tokens[i];b.onclick=()=>inspect(i).catch(e=>$('status').textContent=e.message);$('tokens').append(b)}if(selection===null&&d.tokens.length)await inspect(d.tokens.length-1)}catch(e){$('status').textContent=e.message}}
function change(){epoch++;selection=null;$('tokens').replaceChildren();$('distributions').replaceChildren();for(const id of ['original','edit','metrics','step','text'])$(id).textContent='';refresh()}
(async()=>{try{const runs=await (await fetch('/runs')).json();
 $('run').replaceChildren(...runs.map(r=>{const o=document.createElement('option');o.value=o.textContent=r;return o}));
 }catch(e){$('status').textContent='Could not list runs'} change()})();
$('run').onchange=change;$('branch').onchange=change;refresh();setInterval(refresh,5000);
</script>
